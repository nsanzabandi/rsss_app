# RSSS — Nginx config for the Dockerized deployment.
# Mounted into the `nginx` container at /etc/nginx/conf.d/rsss.conf (see
# docker-compose.yml). Proxies to the `app` service by its Docker DNS name
# instead of 127.0.0.1 — everything else matches deploy/rsss_nginx.conf
# (standalone mode), which stays as the reference for the non-Docker/systemd
# deployment path.

limit_req_zone $binary_remote_addr zone=rsss_login:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1000;

    location = / {
        return 301 /rsss_app/;
    }

    location /rsss_app/assets/ {
        alias /opt/rsss_app/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /rsss_app/do-login {
        limit_req zone=rsss_login burst=3 nodelay;
        proxy_pass         http://app:8050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /rsss_app/ {
        proxy_pass         http://app:8050;
        proxy_http_version 1.1;

        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        proxy_buffering off;
    }
}

# ── HTTPS (later) ──────────────────────────────────────────────────────────
# Once a domain points at this server, either:
#   a) add a `certbot` sidecar container + a webroot volume shared with nginx, or
#   b) put a host-level reverse proxy (with its own certbot) in front of this
#      container's port 80/443.
