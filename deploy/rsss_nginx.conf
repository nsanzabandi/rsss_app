# ══════════════════════════════════════════════════════════════════════════════
# RSSS – Rwanda Stunting Surveillance System
# Nginx Reverse Proxy Configuration
#
# The app is served at:  http(s)://SERVER_IP/rsss_app/
# Other apps on this server are unaffected — they use different location blocks.
#
# BEFORE USE:
#   Replace SERVER_IP_OR_DOMAIN with your actual server IP or hostname.
#   If you have a real domain + certbot, follow the HTTPS section below.
# ══════════════════════════════════════════════════════════════════════════════

# ── Rate-limiting zone (prevents login brute-force) ───────────────────────────
limit_req_zone $binary_remote_addr zone=rsss_login:10m rate=5r/m;

# ── Main server block ─────────────────────────────────────────────────────────
# This is a location-only config meant to be included inside your existing
# server {} block (or use the standalone block below if RSSS is the only app
# needing a specific vhost).
#
# Option A: Add these location blocks inside your EXISTING Nginx server {} block
# ─────────────────────────────────────────────────────────────────────────────
#
#   location /rsss_app/assets/ {
#       alias /opt/rsss_app/assets/;
#       expires 7d;
#   }
#   location = /rsss_app/do-login {
#       limit_req zone=rsss_login burst=3 nodelay;
#       proxy_pass http://127.0.0.1:8050;
#       include /etc/nginx/snippets/rsss_proxy.conf;
#   }
#   location /rsss_app/ {
#       proxy_pass http://127.0.0.1:8050;
#       include /etc/nginx/snippets/rsss_proxy.conf;
#   }
#
# ─────────────────────────────────────────────────────────────────────────────
# Option B: Standalone server block (shown below) — use this if RSSS needs
# its own IP-based vhost (no domain name).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                       # Matches any IP — change to your domain if you have one

    # ── Security headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # ── Body size (PDF generation payloads) ────────────────────────────────────
    client_max_body_size 50M;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # ── Logging ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/rsss_access.log;
    error_log  /var/log/nginx/rsss_error.log;

    # ── Root redirect: /rsss_app/ ───────────────────────────────────────────────
    location = / {
        return 301 /rsss_app/;
    }

    # ── Static assets — served by Nginx directly (faster than Dash) ────────────
    location /rsss_app/assets/ {
        alias /opt/rsss_app/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Login endpoint: rate-limited ───────────────────────────────────────────
    location = /rsss_app/do-login {
        limit_req zone=rsss_login burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Main RSSS Dash app ─────────────────────────────────────────────────────
    # IMPORTANT: proxy_pass must NOT have a trailing path rewrite.
    # Dash's requests_pathname_prefix='/rsss_app/' means it already expects
    # the full /rsss_app/ URL — Nginx passes it through unchanged.
    location /rsss_app/ {
        proxy_pass         http://127.0.0.1:8050;
        proxy_http_version 1.1;

        # Required for Dash's long-polling / SSE callbacks
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow slow callbacks (DB aggregation, PDF generation)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Disable buffering so Dash streaming responses work
        proxy_buffering off;
    }
}

# ── HTTPS upgrade (optional — add after running certbot) ──────────────────────
# Run:  sudo certbot --nginx -d your.domain.com
# Certbot will automatically add the ssl_certificate lines and redirect block.
